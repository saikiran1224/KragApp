version: '3.8' # Version of the Docker Compose Schema

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kragapp_db
      POSTGRES_USER: kragapp_admin
      POSTGRES_PASSWORD: kragapplocal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
